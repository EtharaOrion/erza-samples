schema_version = "1.3"

[metadata]
author_name = "Erza FORGE"
difficulty = "hard"
difficulty_explanation = "Rendering a payee's details as one line of text is not hard. Rendering it as the line a government transmission channel will accept is, because the channel does not read the line - it slices it at absolute character positions it holds internally, and a field that starts one position from where the published layout puts it arrives as a different field, taking every field after it along. The published layout is a table of some fifty rows, and the part of it that is widely reproduced is the opening: the record type, the year, the identification number, the block of payment amount fields. The part that decides this task is the interior and the tail - two reserved runs of sixteen and forty positions that sit between fields that look adjacent, a second name line most payees do not use, a return-specific block that differs from the neighbouring return type's block by a single position, and an indicator whose code is 2 where every other indicator in the same block uses 1. Most of the graded weight therefore sits past the payment amounts, where an implementation written from recall drifts. Nothing about the record can be recovered from the payee data: the data says what to write, never where, and there is no example record anywhere in the inputs from which a position could be counted off. A submission that places the opening correctly and packs the rest of the record on without the reserved runs is a well-formed line of the right length that fails eight of the ten graded field groups."
category = "office-white-collar"
subcategory = "tax-information-reporting"
category_confidence = "high"
task_type = ["formatting", "transformation"]
modality = ["json", "document"]
interface = ["terminal", "python"]
skill_type = ["file-format-knowledge", "domain-procedure"]
tags = [
  "information-returns",
  "positional-layout",
  "regulatory-transmission",
  "payee-detail-record",
  "byte-exact-output",
]

[verifier]
type = "test-script"
