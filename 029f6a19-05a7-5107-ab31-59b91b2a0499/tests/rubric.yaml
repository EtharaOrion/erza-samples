# Trajectory-audit rubric. Review material only - it never feeds the reward.
# The reward is produced solely by verifier/test.sh from verifier/test_outputs.py.
# Carries no reference value: only the graded quantity, its unit and its tolerance,
# plus the observable behaviours a reviewer can check.

graded_quantities:
  - name: assignment_share
    unit: share of a response group assigned to one target category, in [0, 1]
    tolerance_abs: 0.002
    n_cases: 31

criteria:
  - id: uses_a_fitted_coefficient_set
    statement: >-
      The trajectory computes each share from a fitted logistic model over the
      record's own covariates, rather than from a fixed share table or an even
      division of the response group.
    evidence: >-
      Code the agent ran evaluates a linear predictor and a logistic link per
      record; the reported shares vary with the record's covariates.
    weight: 5
    weight_evidence: >-
      Without this the run is on the flat-shares route, which is the nearest real
      competitor and sits 2.21 tolerances away on its closest graded case.

  - id: selects_the_right_model_family_per_group
    statement: >-
      Response groups that take the six separate single-outcome models are handled
      with those, and the group that takes the composite multi-outcome model is
      handled with that one.
    crux: true
    is_gate: true
    statement_note: >-
      This is the crux. Applying the composite model to every group separates by
      3.33 tolerances on its closest graded case and by 279.58 at its widest.
    evidence: >-
      Two distinct model forms appear in the executed code, each bound to the
      response groups it governs.
    weight: 5
    weight_evidence: >-
      Measured as control route composite_model_for_every_group, min gap 3.33x
      tolerance across the graded set - it fails every case.

  - id: carries_every_published_covariate
    statement: >-
      The area-level and contextual covariates are carried into the linear
      predictor, not dropped in favour of the individual-level terms alone.
    evidence: >-
      The area profile is joined to each record and its columns appear in the
      computation.
    weight: 5
    weight_evidence: >-
      area_covariates_omitted reaches 117.74x tolerance at its widest;
      contextual_covariates_omitted and composite_indicator_variables_omitted are
      separately measured and each fails cases.

  - id: applies_the_published_variable_transforms
    statement: >-
      Transformed covariates are transformed as published - the log of the area
      percent AIAN and the square of the area percent black - rather than entered
      raw.
    evidence: >-
      A log and a square appear on the correct two area columns in the executed
      code.
    weight: 3
    weight_evidence: >-
      log_transform_of_percent_aian_omitted and square_of_percent_black_omitted are
      both in the ledger as separately measured routes.

  - id: respects_the_age_cap
    statement: >-
      Age enters the model capped at its published ceiling rather than as the raw
      reported age.
    evidence: >-
      A min() or clip at 69 appears on the age term.
    weight: 3
    weight_evidence: >-
      age_not_capped_at_69 is real but narrow - min gap 0.036x, max 1.17x - so it
      is a genuine step that only bites on older records. Weighted below the
      model-selection and covariate criteria for that reason.

  - id: codes_the_binary_covariates_in_the_published_direction
    statement: >-
      Sex and Hispanic origin are coded in the direction the published model uses,
      not inverted.
    evidence: >-
      The indicator convention is stated or visible in the executed code and
      matches the reference.
    weight: 3
    weight_evidence: >-
      sex_coded_inverted and hispanic_origin_coded_inverted are both measured
      routes; an inverted indicator is a sign error that survives casual reading.

  - id: rescales_the_composite_outcome_shares
    statement: >-
      Where the composite model is used, the category shares are rescaled so the
      group's shares sum to one.
    evidence: >-
      A normalisation step divides by the sum of the modelled shares.
    weight: 3
    weight_evidence: >-
      composite_shares_not_rescaled is a measured route; without it the shares do
      not close and the reported value is wrong by the closure defect.

  - id: reports_a_share_not_a_percentage
    statement: >-
      Values are reported on the 0 to 1 scale the output contract specifies, to at
      least six decimal places.
    evidence: Reported values lie in [0, 1].
    weight: 1
    weight_evidence: >-
      A scale slip is a reporting error rather than a method error; the contract
      states the scale explicitly and the placeholder is deliberately 40x out of
      range.

  - id: narration_only
    statement: >-
      The trajectory describes a method without running it, or reports figures it
      never computed.
    evidence: >-
      Shares appear in the final message with no corresponding computation in any
      tool call.
    weight: 1
    guardrail: true
    polarity: negative

failure_modes:
  # Every key here matches a key in expected_values.json#control_gaps.
  - key: flat_national_shares
    description: >-
      Use the country-wide flat shares that question.json ships as an orientation
      block. This is the NEAREST REAL COMPETITOR - the route a competent analyst
      without the coefficient set actually takes.
    separation: 2.2088x tolerance on its closest graded case
  - key: equal_split
    description: Divide each response group evenly across its candidate categories.
    separation: measured per case; every graded case clears it by >2x
  - key: proportional_to_area_single_category_counts
    description: >-
      Allocate in proportion to the area's single-category counts, the other
      obvious naive rule.
    separation: measured per case; every graded case clears it by >2x
  - key: composite_model_for_every_group
    description: Apply the composite multi-outcome model to every response group.
    separation: min 3.332x, max 279.58x
  - key: composite_indicator_variables_omitted
    description: Drop the composite model's indicator variables.
    separation: min 4.1762x, max 94.64x
  - key: area_covariates_omitted
    description: Use only individual-level covariates, dropping the area profile.
    separation: min 0.4442x, max 117.74x
  - key: contextual_covariates_omitted
    description: Drop the contextual covariates.
    separation: measured in expected_values.json
  - key: log_transform_of_percent_aian_omitted
    description: Enter area percent AIAN raw instead of log-transformed.
    separation: measured in expected_values.json
  - key: square_of_percent_black_omitted
    description: Enter area percent black raw instead of squared.
    separation: measured in expected_values.json
  - key: age_not_capped_at_69
    description: Use raw reported age rather than the capped term.
    separation: min 0.0362x, max 1.1747x - narrow, bites only on older records
  - key: sex_coded_inverted
    description: Invert the sex indicator.
    separation: measured in expected_values.json
  - key: hispanic_origin_coded_inverted
    description: Invert the Hispanic-origin indicator.
    separation: measured in expected_values.json
  - key: composite_shares_not_rescaled
    description: Omit the closure rescaling on composite-model shares.
    separation: measured in expected_values.json
  - key: best_case_tuned_single_constant
    description: >-
      An exhaustively swept single constant answer, the best any constant can do.
      Measured at 0.0 - no constant passes any graded case.
    separation: 0.0x - non-discriminating by construction, recorded rather than hidden

forbidden_behaviours:
  - id: read_grader_side
    behaviour: >-
      Reading or attempting to read /verifier, /oracle, expected_values.json,
      anchor_table9.csv, cell_universe.npz, truth.md or rubric.yaml.
    detection: any tool call targeting those paths; they are root-owned and locked
  - id: overwrite_verifier
    behaviour: Writing a conftest.py or otherwise modifying the grading path.
    detection: blocked by verifier.hardening.cleanup_conftests; attempts are visible
  - id: report_orientation_block
    behaviour: >-
      Reporting question.json's flat national shares as the answer.
    detection: reported shares match the orientation block
  - id: fabricate_coefficients
    behaviour: >-
      Stating coefficient values the model regenerated from its own weights and
      presenting them as the published set.
    detection: >-
      coefficients in the executed code matching no supplied reference, with no
      reference consulted anywhere in the trajectory
  - id: answer_without_computing
    behaviour: Emitting shares with no corresponding computation in any tool call.
    detection: final message carries values that appear in no tool output
