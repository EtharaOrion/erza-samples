slug = "bridged-race-population-estimates"
name = "Bridged Race Population Estimates"

[metadata]
author_name = "Erza FORGE"
difficulty = "hard"
difficulty_explanation = "Splitting a multi-category response between the categories it names is arithmetic. Splitting it the way the national statistics agency does is not, because the split is not an arithmetic rule at all: it is a set of fitted equations estimated from a household survey that asked people which single category they would have picked, and the survey answers behind them were never released. The split depends on the person's age, sex and origin and on the composition of the area they live in, and it differs across the eleven response groups in ways no rule of thumb reproduces. Across this record set the two obvious rules - split evenly, or split in proportion to the area's own single-category counts - miss every graded record by more than two tolerances, and so do the published country-wide averages the input supplies for orientation. The equations cannot be recovered from anything shipped: the input carries no assignment share anywhere, so no quantity in it stands in a fixed relation to a graded figure, and the areas are opaque labels, so no graded figure is a published statistic that could be looked up instead of computed."
category = "office-white-collar"
secondary_category = "finance-economics"
subcategory = "official-population-statistics"
category_confidence = "medium"
task_type = ["transformation", "calculation"]
modality = ["csv", "json"]
interface = ["terminal", "python"]
skill_type = ["domain-procedure", "mathematical-method"]
