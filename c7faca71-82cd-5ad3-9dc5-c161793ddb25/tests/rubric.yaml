# Trajectory-review rubric for flight-duty-period-legality.
# Review material only. It never touches the reward: the reward is
# verifier/test.sh, which is deterministic pytest over /root/results.json.

task: flight-duty-period-legality
purpose: >-
  Attribute a run's score to a named route. A wrong answer on this task is
  almost always one of a small number of identifiable readings of the published
  limit set, and this rubric is how a reviewer names which one.

criteria:
  - id: reads_roster
    weight: low
    question: >-
      Did the run open the baked roster and the contract under /root/data rather
      than work from the prompt alone?

  - id: separates_augmented_from_unaugmented
    weight: medium
    question: >-
      Did the run notice that pairings with more than the minimum crew and an
      onboard rest facility are governed by a different matrix, with different
      report-time bands, and route them to it?

  - id: indexes_the_matrix_on_both_axes
    weight: high
    question: >-
      CRUX. Did the run select the maximum duty period by BOTH the report-time
      band and the segment count (or, when augmented, the facility class and
      pilot count), rather than by one axis or by a single flat figure?

  - id: applies_the_acclimation_reduction
    weight: medium
    question: >-
      Did the run reduce the matrix value for the pairings whose crew is not
      acclimated to the theater the report time is expressed in?

  - id: tests_every_split_duty_condition
    weight: medium
    question: >-
      Where a rest opportunity is scheduled inside the pairing, did the run test
      every published condition before excluding it from the duty period, and
      leave the whole elapsed period on duty when any one failed?

  - id: enumerates_all_seven_limits
    weight: high
    question: >-
      Did the run take a margin against every limit that applies, including the
      rolling cumulative ceilings and the two rest provisions, rather than
      stopping at the duty period?

  - id: adds_this_pairing_to_the_rolling_totals
    weight: medium
    question: >-
      Did the run include the pairing's own duty and flight time in the rolling
      totals before comparing them with their ceilings?

  - id: reports_the_contract
    weight: low
    question: >-
      Did the run write /root/results.json with all three fields for every
      pairing, in signed whole minutes and with a name drawn from limit_codes?

  - id: verification_that_could_disagree
    weight: medium
    question: >-
      Did the run check itself against something that could have come out
      differently - a second reading of a matrix cell, a sign check on a margin,
      a recomputation of one pairing by hand - rather than treating a clean
      script run as verification?

forbidden_behaviours:
  - id: grader_surface_access
    detail: >-
      Reading or probing /verifier, /oracle, expected_values.json, part117.xml,
      reg_reparse.py, truth.md, rubric.yaml or build/. Any hit voids the pair
      regardless of score.
  - id: network_fetch
    detail: >-
      Fetching the published part text or the limit tables from the network, or
      installing a package, under a declared no-network environment. Citing the
      source in prose is not a fetch; the detector requires a fetch verb.
  - id: hand_assembled_answer
    detail: >-
      Producing the fifty-one figures by hand without an executable derivation,
      which makes the run unattributable and is not reproducible.
  - id: answer_shaped_padding
    detail: >-
      Emitting placeholder or copied values to fill the contract when the
      derivation did not complete.

failure_modes:
  - id: flat_14h_duty_day
    detail: >-
      A single flat fourteen-hour duty ceiling substituted for the matrix. The
      nearest real competing method, and the route a run without the limit
      tables produces. Measured: reproduces none of the graded cases.
  - id: report_row_ignored
    detail: >-
      The mid-morning report-time band used for every pairing, with the segment
      column read correctly.
  - id: segment_column_ignored
    detail: >-
      The matrix read as a function of report time alone. Measured, and recorded
      as non-discriminating on the bands where the published columns coincide.
  - id: augmentation_ignored
    detail: >-
      The unaugmented matrix applied to augmented pairings, ignoring the rest
      facility class and the extra pilots.
  - id: unforeseen_extension_applied
    detail: >-
      The two-hour relief for unforeseen circumstances added to a scheduled
      ceiling. The most defensible-looking wrong answer on this task: the relief
      is real and published, but it cannot enlarge a scheduled maximum.
  - id: unacclimated_reduction_skipped
    detail: >-
      The thirty-minute reduction for an unacclimated crew omitted, because it
      sits in prose rather than in a cell.
  - id: split_duty_relief_skipped
    detail: >-
      A qualifying accommodation rest counted as duty.
  - id: split_duty_relief_unconditional
    detail: >-
      Any scheduled accommodation rest excluded from duty without testing the
      published conditions on it.
  - id: cumulative_limits_ignored
    detail: >-
      Only the per-pairing limits enumerated; the rolling ceilings never checked.
      Uses the correct matrix, so it is not producible without it.
  - id: flight_duty_period_only
    detail: >-
      The duty period reported as the governing limit everywhere. Floor-bounding
      strawman rather than a competing method; it bounds how much of the graded
      set a run can collect without enumerating.
