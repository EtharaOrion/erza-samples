# canonical_content_hash — RE-SEALED 2026-08-05 against the layout shipped today.
#
# Construction: sha256 over the newline-joined "relpath:sha256" lines of this
# bundle's manifest, sorted by relpath, UTF-8 encoded, no trailing newline.
# relpath is POSIX-style and relative to this bundle directory, so the hash is
# path-independent.
#
# Scope: every regular file shipped in this bundle (20 files), recursively.
# Exclusions:
#   * trajectories/ in full — run records, not task content, and they change
#     every time the grid is re-run;
#   * task.toml itself — it carries this hash, so including it would make the
#     field self-referential and impossible to verify;
#   * transient artifacts that are never shipped: __pycache__/, *.pyc, .DS_Store.
#
# Verify with: python3 verify_seal.py <path to this repository>   (the checker
# ships with the erza harness, at the harness root).
#
# STABLE IDENTIFIER — THE TASK ID IS NOT DERIVED FROM THE VALUE ABOVE.
# [task] id, this bundle's directory name and tests/rubrics.json task_id are
# load-bearing identifiers referenced across the repo and inside the run records
# under trajectories/. They were minted ONCE, as uuid5(namespace, <the ORIGINAL
# v1 content hash>), and are deliberately not re-derived on re-seal.
# uuid5(namespace, canonical_content_hash) therefore does NOT equal the task id
# and must not be expected to: recomputing the id from this field would rename
# the task on every byte that changes. The id names the task; the hash certifies
# the bytes.
#
# Bundle-specific note: on this bundle the id was never reproducible from a
# content hash at all. uuid5(namespace, cab31a18…) — the pre-re-seal value —
# yields f5612cf8-6563-50e8-bb2e-b8835d4c0185, and no hash recorded anywhere in
# this bundle's history reproduces 903d6f33-74c0-554d-b210-9c2b3a5138fb. This is
# a fair execution-coupled fork whose id was inherited, not minted here.
