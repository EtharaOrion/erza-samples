rejected_routes:
- - age_not_capped_at_69
  - 'A real competing method: use the record''s own age above 69 rather than the capped value. It affects only the graded cases at 70 and over and is recorded with that scope.'
- - area_covariates_omitted
  - 'A real competing method: keep the models but drop the four area composition covariates, which is what a run does when it cannot decide how the percentages are scaled.'
- - best_case_tuned_single_constant
  - Not a competing method - an adversarial lower bound on luck, measured rather than assumed. The single constant answer that clears the most graded cases, swept at 5e-06 resolution over [0, 1]. The graded set is built so that no two goldens sit within twice the tolerance band of each other, so this is bounded at one case by construction.
- - composite_indicator_variables_omitted
  - 'A real competing method: evaluate the composite model without the three group indicators, which is what happens when the constrained-to-zero convention in the published table is read as ''not in the model''.'
- - composite_model_for_every_group
  - 'A real competing method: use the composite model for all eleven response groups instead of only for the five it was fitted for. It is the simplification a reader makes on finding one table that covers everything.'
- - composite_shares_not_rescaled
  - 'A real competing method: for the composite groups, report the modelled share without rescaling over the categories that actually apply. The rescale step is a separate sentence in the published method and is easy to miss; the route is identical to the correct one on the six groups with their own models, which is why it is recorded rather than dropped.'
- - contextual_covariates_omitted
  - 'A real competing method: keep only the person-level covariates and drop region, urbanisation and the area composition together. It is the strongest form of the ''covariates are a detail'' error.'
- - equal_split
  - 'A real competing method and the first of the two routes the discrimination assertion is run against: split each response equally over the categories it names. It is what a run without the withheld coefficient set can produce from the shipped file alone.'
- - flat_national_shares
  - 'THE NEAREST REAL COMPETITOR, and it is published: the mean assignment share for each response group over the whole country. question.json ships it, labelled as orientation only. It gets the response group right and drops every person-level and area-level covariate, which is exactly the dimension the withheld models supply.'
- - hispanic_origin_coded_inverted
  - 'A coding error rather than a method: the Hispanic origin indicator reversed. Recorded because the shipped file spells origin as a word and the published model codes it as an indicator.'
- - log_transform_of_percent_aian_omitted
  - 'A real competing method: read the area percentages straight off the profile without the logarithm the published footnote specifies for two of the separate models and for the composite model.'
- - proportional_to_area_single_category_counts
  - 'A real competing method and the second route the discrimination assertion is run against: allocate in proportion to the area''s own single-category percentages, which the shipped area profile carries. It is the most defensible thing to do without the models and is the route an analyst reaches for when the area composition is the only signal available.'
- - sex_coded_inverted
  - 'A coding error rather than a method: the sex indicator reversed, which is the other place a word-to-indicator mapping can flip.'
- - square_of_percent_black_omitted
  - 'A real competing method: omit the square the published footnote specifies for two of the separate models. It moves only the models that use it, which is why the recorded gap is scoped to the cases it alters.'
