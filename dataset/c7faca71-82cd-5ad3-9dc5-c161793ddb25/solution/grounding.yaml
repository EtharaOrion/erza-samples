rejected_routes:
- - augmentation_ignored
  - 'A real competing method: an analyst who finds one matrix and not the other applies it to everything. Scored only over the pairings it alters, since on unaugmented pairings it is by definition the correct route.'
- - cumulative_limits_ignored
  - 'A real competing method: the cumulative limits need the crew member''s duty history rather than the pairing, and an analysis that starts from the pairing sheet stops before them.'
- - flat_14h_duty_day
  - 'The nearest real competing method: what a scheduler who knows the limits exist but not the matrix actually does. 14 hours is the figure the regulation itself states for the combined split-duty period and the figure the superseded domestic scheduled-duty rule used, so it is the number that is reached for. Not a strawman.'
- - flight_duty_period_only
  - 'Floor-bounding strawman rather than a competing method: it is what answering the headline limit everywhere looks like, and it bounds how much of the graded set a run can collect without enumerating.'
- - report_row_ignored
  - 'A real competing method: the mid-morning row is the one quoted in trade summaries, and using it everywhere is the mirror image of ignoring the segment column.'
- - segment_column_ignored
  - 'A real competing method: reading the matrix as a function of report time alone is the most common misreading of it.'
- - split_duty_relief_skipped
  - 'A real competing method: the split-duty provision is optional relief and an analyst who does not know it is there leaves the whole elapsed period on duty.'
- - split_duty_relief_unconditional
  - 'A real competing method, and the opposite error to skipping the relief: the conditions are a six-part conjunction and taking the relief on sight is the standard shortcut.'
- - unacclimated_reduction_skipped
  - 'A real competing method: the reduction sits in a different paragraph from the matrix and is routinely missed.'
- - unforeseen_extension_applied
  - 'A real competing method, and the most defensible-looking wrong answer here: the extension is real and published, but it is relief for circumstances arising after the schedule is set, so it can never enlarge a SCHEDULED limit.'
