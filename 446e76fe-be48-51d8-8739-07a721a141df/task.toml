slug = "local-magnitude-seismology"
name = "Local Magnitude Seismology"

[metadata]
author_name = "Ethara.AI"
category    = "natural-science"
subcategory = "seismology"
category_confidence = "high"
difficulty  = "hard"
difficulty_explanation = "Requires reading miniSEED + StationXML, removing the instrument response correctly (pre-filter + water level, correct output units), simulating a Wood-Anderson seismograph with the IASPEI standard constants, measuring the maximum-horizontal peak amplitude in millimetres, and applying the Southern California distance-correction (Hutton & Boore -logA0) to obtain the local magnitude. The dominant failure is the Wood-Anderson response itself: it acts on displacement and therefore carries two zeros at the origin, but the one-zero velocity form is what most circulated code contains, and it understates the magnitude by ~0.80. Skipping the response removal or using a generic magnitude formula also fail."
task_type   = ["analysis", "calculation"]
modality    = ["time-series", "scientific-data"]
interface   = ["terminal", "python"]
skill_type  = ["domain-procedure", "library-api-usage", "mathematical-method"]
tags        = ["seismology", "earthquake", "local-magnitude", "wood-anderson", "obspy", "instrument-response", "miniseed"]

