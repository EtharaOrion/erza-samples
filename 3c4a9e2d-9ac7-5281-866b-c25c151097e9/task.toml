slug = "ghg-conversion-factor-vintage"
name = "GHG Conversion Factor Vintage"

[metadata]
author_name = "Ethara.AI"
category    = "industrial-physical-systems"
secondary_category = "finance-economics"
subcategory = "corporate-ghg-accounting"
category_confidence = "high"
difficulty  = "hard"
difficulty_explanation = "Converting a metered quantity to kilograms of CO2e is one multiplication. Doing it the way a UK corporate inventory is required to is not, because the multiplier is not a physical constant: the government re-derives every conversion factor from fuel-quality surveys, the realised grid generation mix, water-industry returns and waste-stream studies, and none of that underlying survey data is released. The published values are revised as that evidence is re-collected, by amounts ranging from a fraction of a percent to tens of percent in directions that differ by category, so a factor cannot be derived, extrapolated or recovered from anything in the input — and the specification that fixes which published values a given line takes is not reproduced in the prompt. Across this ledger the graded tolerance sits below the error left by recalling a factor to three significant figures, so approximate recall does not reach a graded value either, and a run that settles the multipliers by inference produces a well-formed emissions figure for every line and the right one for none."
task_type   = ["calculation", "transformation"]
modality    = ["csv", "json"]
interface   = ["terminal", "python"]
skill_type  = ["domain-procedure"]
tags        = ["ghg-inventory", "emissions-reporting", "conversion-factors", "secr", "factor-vintages", "corporate-reporting", "uk-government-data"]

[environment]
network_mode      = "no-network"
os                = "linux"
arch              = "linux/amd64"
cpus              = 2
memory_mb         = 4096
build_timeout_sec = 900.0

[agent]
timeout_sec = 2400.0

[verifier]
timeout_sec   = 300.0
