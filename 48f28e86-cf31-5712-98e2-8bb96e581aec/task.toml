difficulty  = "hard"
difficulty_explanation = "Reducing magnetic-referenced survey azimuths to true azimuths requires the local magnetic declination at each station for the survey epoch. Declination is not a quantity that can be recalled or estimated to survey precision: it must be evaluated from the geomagnetic field model, which is a spherical-harmonic synthesis of a large set of region-independent Gauss coefficients. The naive routes - applying the single rounded value from the supplied old chart, or leaving the bearings unreduced - are wrong at every station by many degrees (tens to hundreds of times the tolerance). Even with the coefficients in hand the computation has a load-bearing subtlety: the station coordinates are geodetic and must be converted to geocentric before the harmonic synthesis, and treating the geodetic latitude as geocentric displaces every station past tolerance."
task_type   = ["calculation", "analysis"]
modality    = ["csv", "scientific-data"]
interface   = ["terminal", "python"]
skill_type  = ["domain-procedure", "mathematical-method"]
tags        = ["geomagnetism", "magnetic-declination", "geodesy", "survey", "spherical-harmonics", "field-reduction"]

